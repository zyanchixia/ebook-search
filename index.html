<!DOCTYPE html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px 20px;
    color: #333;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 32px 24px;
    text-align: center;
  }
  .header h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: 2px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .search-bar {
    padding: 24px;
    background: #f7f7fb;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 10px;
  }
  .search-bar input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #667eea; }
  .search-bar button {
    padding: 14px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
  }
  .search-bar button:hover { opacity: 0.92; }
  .search-bar button:active { transform: scale(0.97); }
  .results {
    padding: 20px 24px 28px;
    min-height: 200px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .greeting {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 14px;
    color: #444;
  }
  .greeting .keyword { color: #764ba2; font-weight: bold; }
  .result-item {
    background: #f9f9fc;
    border-left: 4px solid #667eea;
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .result-item:hover { background: #eef0ff; }
  .result-item .book-name {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .result-item a {
    display: inline-block;
    padding: 7px 16px;
    background: #667eea;
    color: #fff !important;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.2s;
  }
  .result-item a:hover { background: #5468d4; }
  .code-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    padding: 4px 10px;
    background: #fff3cd;
    border: 1px solid #ffe08a;
    border-radius: 6px;
    font-size: 13px;
    color: #7a5c00;
    vertical-align: middle;
  }
  .code-box b { color: #c0392b; letter-spacing: 1px; }
  .copy-btn {
    padding: 2px 8px;
    background: #f0ad4e;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: #ec971f; }
  .copy-btn.copied { background: #28a745; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-exact { background: #ffd9d9; color: #c0392b; }
  .tag-fuzzy { background: #d9ecff; color: #2471a3; }
  .footer-tip {
    margin-top: 18px;
    padding: 12px 16px;
    background: #fff8e1;
    border: 1px dashed #f0c040;
    border-radius: 8px;
    font-size: 14px;
    color: #7a5c00;
    line-height: 1.7;
  }
  .footer-tip .wx { color: #c0392b; font-weight: bold; }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 15px;
    line-height: 1.8;
  }
  .empty .wx { color: #c0392b; font-weight: bold; }
  .loading { text-align: center; padding: 30px; color: #999; }
  .stats { font-size: 13px; color: #888; margin-bottom: 12px; }
</style>
</head>

</div>

var inputEl = document.getElementById('searchInput');

function escapeHtml(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function doSearch(){
  var q = inputEl.value.trim();
  if(!q){
    resultsEl.innerHTML = '<div class="empty">请输入书籍名字后点击搜索或按回车键</div>';
    return;
  }
  var ql = q.toLowerCase();
  var exact = [], fuzzy = [];
  for(var i=0;i<BOOKS.length;i++){
    var name = BOOKS[i][0], url = BOOKS[i][1], code = BOOKS[i][2];
    var nl = name.toLowerCase();
    if(nl === ql){ exact.push([name,url,code]); }
    else if(nl.indexOf(ql) !== -1 || ql.indexOf(nl) !== -1){ fuzzy.push([name,url,code]); }
  }
  // exact first, then fuzzy
  var all = exact.concat(fuzzy);

  if(all.length === 0){
    resultsEl.innerHTML =
      '<div class="greeting">主人你好，我没有找到你想要的资料，请联系我<span class="wx">ruyissq6688</span>试试吧</div>';
    return;
  }

  var html = '<div class="greeting">主人你好，你查找的<span class="keyword">' + escapeHtml(q) + '</span>书籍结果为：</div>';
  html += '<div class="stats">共找到 ' + all.length + ' 条结果（精确匹配 ' + exact.length + ' 条，模糊匹配 ' + fuzzy.length + ' 条）</div>';
  for(var j=0;j<all.length;j++){
    var nm = all[j][0], u = all[j][1], c = all[j][2];
    var tag = j < exact.length ? '<span class="tag tag-exact">精确</span>' : '<span class="tag tag-fuzzy">模糊</span>';
    var codeHtml = c ? '<span class="code-box">提取码：<b>' + escapeHtml(c) + '</b><button class="copy-btn" data-code="' + escapeHtml(c) + '">复制</button></span>' : '';
    if(u){
      html += '<div class="result-item"><div class="book-name">' + escapeHtml(nm) + tag + '</div><a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">网盘链接</a>' + codeHtml + '</div>';
    } else {
      html += '<div class="result-item"><div class="book-name">' + escapeHtml(nm) + tag + '</div><span style="color:#999;font-size:13px;">暂无链接</span>' + codeHtml + '</div>';
    }
  }
  html += '<div class="footer-tip">请网盘自取，若有任何问题请联系我的微<span class="wx">ruyissq6688</span></div>';
  resultsEl.innerHTML = html;
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
inputEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.keyCode === 13){ doSearch(); }
});
// Copy extraction code via event delegation (buttons are dynamically generated)
resultsEl.addEventListener('click', function(e){
  var btn = e.target.closest('.copy-btn');
  if(!btn) return;
  var code = btn.getAttribute('data-code') || '';
  var done = false;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(function(){
      btn.classList.add('copied'); btn.textContent = '已复制';
      setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '复制'; }, 1500);
    }).catch(function(){ fallbackCopy(btn, code); });
  } else {
    fallbackCopy(btn, code);
  }
});
function fallbackCopy(btn, code){
  var ta = document.createElement('textarea');
  ta.value = code; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done = true; } catch(e){}
  document.body.removeChild(ta);
  btn.classList.add('copied'); btn.textContent = '已复制';
  setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '复制'; }, 1500);
}
