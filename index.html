<!DOCTYPE html>
<html lang="zh-CN">

<title>电子书资源搜索</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px 20px;
    color: #333;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 32px 24px;
    text-align: center;
  }
  .header h1 { font-size: 26px; margin-bottom: 6px; letter-spacing: 2px; }
  .header p { font-size: 14px; opacity: 0.9; }
  .search-bar {
    padding: 24px;
    background: #f7f7fb;
    border-bottom: 1px solid #eee;
    display: flex;
    gap: 10px;
  }
  .search-bar input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #667eea; }
  .search-bar button {
    padding: 14px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s, transform 0.1s;
  }
  .search-bar button:hover { opacity: 0.92; }
  .search-bar button:active { transform: scale(0.97); }
  .results {
    padding: 20px 24px 28px;
    min-height: 200px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .greeting {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 14px;
    color: #444;
  }
  .greeting .keyword { color: #764ba2; font-weight: bold; }
  .result-item {
    background: #f9f9fc;
    border-left: 4px solid #667eea;
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .result-item:hover { background: #eef0ff; }
  .result-item .book-name {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .result-item a {
    display: inline-block;
    padding: 7px 16px;
    background: #667eea;
    color: #fff !important;
    text-decoration: none;
    border-radius: 6px;
    font-size: 14px;
    transition: background 0.2s;
  }
  .result-item a:hover { background: #5468d4; }
  .code-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 10px;
    padding: 4px 10px;
    background: #fff3cd;
    border: 1px solid #ffe08a;
    border-radius: 6px;
    font-size: 13px;
    color: #7a5c00;
    vertical-align: middle;
  }
  .code-box b { color: #c0392b; letter-spacing: 1px; }
  .copy-btn {
    padding: 2px 8px;
    background: #f0ad4e;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .copy-btn:hover { background: #ec971f; }
  .copy-btn.copied { background: #28a745; }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-exact { background: #ffd9d9; color: #c0392b; }
  .tag-fuzzy { background: #d9ecff; color: #2471a3; }
  .footer-tip {
    margin-top: 18px;
    padding: 12px 16px;
    background: #fff8e1;
    border: 1px dashed #f0c040;
    border-radius: 8px;
    font-size: 14px;
    color: #7a5c00;
    line-height: 1.7;
  }
  .footer-tip .wx { color: #c0392b; font-weight: bold; }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 15px;
    line-height: 1.8;
  }
  .empty .wx { color: #c0392b; font-weight: bold; }
  .loading { text-align: center; padding: 30px; color: #999; }
  .stats { font-size: 13px; color: #888; margin-bottom: 12px; }
  .quota-info {
    text-align: right;
    font-size: 13px;
    color: #764ba2;
    font-weight: 600;
    padding: 0 24px 8px;
    background: #f7f7fb;
  }
  .quota-info .num { color: #c0392b; }
  .quota-exhausted {
    background: #fff0f0;
    border: 1px solid #f5b3b3;
    border-left: 4px solid #c0392b;
    color: #8a1f1f;
    padding: 16px 18px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.8;
    margin: 12px 0;
    text-align: center;
  }
  .quota-exhausted .wx { color: #c0392b; font-weight: bold; }
</style>
</head>

<div class="container">

</div>

function bjDate(){
  // Beijing day key (Asia/Shanghai = UTC+8, no DST). Day resets at Beijing 00:00:00.
  try {
    return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
  } catch(e){
    var n = new Date();
    var y = n.getFullYear(), m = ('0'+(n.getMonth()+1)).slice(-2), d = ('0'+n.getDate()).slice(-2);
    return y + '-' + m + '-' + d;
  }
}

});
function fallbackCopy(btn, code){
  var ta = document.createElement('textarea');
  ta.value = code; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done = true; } catch(e){}
  document.body.removeChild(ta);
  btn.classList.add('copied'); btn.textContent = '已复制';
  setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = '复制'; }, 1500);
}
